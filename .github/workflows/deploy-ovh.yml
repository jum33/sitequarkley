# Publie le site sur l'hébergement OVH à chaque push sur main (remplace le déploiement Netlify).
# Inactif tant que la variable OVH_DEPLOY ne vaut pas "true" (Settings > Secrets and variables > Actions).
# Secrets à créer : OVH_FTP_SERVER (ex. ftp.cluster0XX.hosting.ovh.net), OVH_FTP_USERNAME, OVH_FTP_PASSWORD.
name: Déploiement OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.OVH_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Envoi des fichiers par FTP (seuls les fichiers modifiés partent)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          protocol: ftps
          server-dir: www/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            outils/**
            README*
