<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Un portail IA de SDIS : les agents se connectent à un portail hébergé en France qui contient les assistants, les documents du SDIS, les formulaires, les règles d'accès et le journal ; le portail interroge des modèles d'IA interchangeables en n'envoyant que des extraits, jamais conservés.">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E60000"/>
    </marker>
  </defs>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #1a1a1a; }
    .h { font-weight: 700; }
    .m { fill: #555; }
    .r { fill: #E60000; }
    .w { fill: #fff; }
  </style>

  <rect width="1200" height="760" fill="#ffffff"/>

  <!-- Titre -->
  <text x="600" y="40" class="t h" font-size="26" text-anchor="middle">C'est quoi, un portail IA pour un SDIS ?</text>
  <text x="600" y="64" class="t m" font-size="14" text-anchor="middle">Un espace interne, hébergé en France, où les agents confient des tâches précises à l'IA — en gardant le contrôle.</text>

  <!-- Zone souveraine (agents + portail) -->
  <rect x="24" y="92" width="836" height="560" rx="14" fill="#f7f9fb" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="40" y="80" width="420" height="24" rx="4" fill="#1a1a1a"/>
  <text x="250" y="97" class="t w h" font-size="13" text-anchor="middle">HÉBERGÉ EN FRANCE · DROIT FRANÇAIS ET EUROPÉEN</text>

  <!-- ===== ZONE 1 : agents ===== -->
  <text x="176" y="136" class="t h" font-size="17" text-anchor="middle">1. Les agents du SDIS</text>
  <text x="176" y="156" class="t m" font-size="12" text-anchor="middle">depuis l'ordinateur ou le téléphone</text>

  <!-- 4 agents -->
  <g>
    <rect x="56" y="176" width="240" height="54" rx="8" fill="#fff" stroke="#e0e0e0"/>
    <circle cx="84" cy="203" r="14" fill="#E60000"/><text x="84" y="208" class="t w h" font-size="13" text-anchor="middle">O</text>
    <text x="108" y="199" class="t h" font-size="13">Officier</text>
    <text x="108" y="217" class="t m" font-size="11.5">« Quel départ pour un feu de parking ? »</text>
  </g>
  <g>
    <rect x="56" y="242" width="240" height="54" rx="8" fill="#fff" stroke="#e0e0e0"/>
    <circle cx="84" cy="269" r="14" fill="#E60000"/><text x="84" y="274" class="t w h" font-size="13" text-anchor="middle">P</text>
    <text x="108" y="265" class="t h" font-size="13">Préventionniste</text>
    <text x="108" y="283" class="t m" font-size="11.5">dépose une notice ERP de 80 pages</text>
  </g>
  <g>
    <rect x="56" y="308" width="240" height="54" rx="8" fill="#fff" stroke="#e0e0e0"/>
    <circle cx="84" cy="335" r="14" fill="#E60000"/><text x="84" y="340" class="t w h" font-size="13" text-anchor="middle">RH</text>
    <text x="108" y="331" class="t h" font-size="13">Gestionnaire RH</text>
    <text x="108" y="349" class="t m" font-size="11.5">remplit le formulaire « attestation »</text>
  </g>
  <g>
    <rect x="56" y="374" width="240" height="54" rx="8" fill="#fff" stroke="#e0e0e0"/>
    <circle cx="84" cy="401" r="14" fill="#E60000"/><text x="84" y="406" class="t w h" font-size="13" text-anchor="middle">CG</text>
    <text x="108" y="397" class="t h" font-size="13">Chef de groupe</text>
    <text x="108" y="415" class="t m" font-size="11.5">dicte un RETEX dans le fourgon</text>
  </g>

  <!-- Connexion -->
  <rect x="44" y="446" width="264" height="46" rx="8" fill="#fff5f5" stroke="#E60000"/>
  <text x="176" y="465" class="t h" font-size="11.5" text-anchor="middle">Connexion : compte du SDIS ou code par e-mail</text>
  <text x="176" y="482" class="t m" font-size="11.5" text-anchor="middle">Aucune installation · aucun mot de passe en plus</text>

  <!-- Flèches agents -> portail -->
  <line x1="296" y1="203" x2="366" y2="203" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fl)"/>
  <line x1="296" y1="269" x2="366" y2="269" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fl)"/>
  <line x1="296" y1="335" x2="366" y2="335" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fl)"/>
  <line x1="296" y1="401" x2="366" y2="401" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fl)"/>
  <text x="331" y="195" class="t m" font-size="10.5" text-anchor="middle">question</text>
  <text x="331" y="261" class="t m" font-size="10.5" text-anchor="middle">document</text>
  <text x="331" y="327" class="t m" font-size="10.5" text-anchor="middle">formulaire</text>
  <text x="331" y="393" class="t m" font-size="10.5" text-anchor="middle">voix</text>

  <!-- Retour -->
  <line x1="366" y1="530" x2="296" y2="530" stroke="#E60000" stroke-width="2" marker-end="url(#flr)"/>
  <text x="176" y="526" class="t h r" font-size="12" text-anchor="middle">Résultat prêt à relire, avec ses sources</text>
  <text x="176" y="544" class="t m" font-size="11.5" text-anchor="middle">L'IA prépare, l'agent décide. Rien ne part sans validation.</text>

  <!-- ===== ZONE 2 : portail ===== -->
  <rect x="370" y="120" width="470" height="512" rx="12" fill="#fff" stroke="#E60000" stroke-width="2.5"/>
  <rect x="370" y="120" width="470" height="44" rx="12" fill="#E60000"/>
  <rect x="370" y="150" width="470" height="14" fill="#E60000"/>
  <text x="605" y="141" class="t w h" font-size="17" text-anchor="middle">2. LE PORTAIL — portail-ia.sdis00.fr</text>
  <text x="605" y="158" class="t w" font-size="11.5" text-anchor="middle">aux couleurs et à l'écusson du SDIS · il parle pompier (SPV, FMPA, CRSS, GDO…)</text>

  <!-- Bloc assistants -->
  <rect x="386" y="178" width="218" height="112" rx="8" fill="#fff5f5" stroke="#f0c0c0"/>
  <text x="398" y="198" class="t h r" font-size="13">Assistants spécialisés</text>
  <text x="398" y="218" class="t" font-size="12">@doctrine · @prevention</text>
  <text x="398" y="236" class="t" font-size="12">@rh · @marches</text>
  <text x="398" y="256" class="t m" font-size="11">Chacun connaît son périmètre</text>
  <text x="398" y="272" class="t m" font-size="11">et cite ses sources.</text>

  <!-- Bloc documents -->
  <rect x="616" y="178" width="208" height="112" rx="8" fill="#f0f8ff" stroke="#c8dcf0"/>
  <text x="628" y="198" class="t h" font-size="13">Les documents du SDIS</text>
  <text x="628" y="218" class="t" font-size="12">Règlement opérationnel, GDO,</text>
  <text x="628" y="236" class="t" font-size="12">notices, délibérations, notes</text>
  <text x="628" y="256" class="t m" font-size="11">Rangés pour être interrogés,</text>
  <text x="628" y="272" class="t m" font-size="11">un projet par dossier.</text>

  <!-- Bloc formulaires -->
  <rect x="386" y="302" width="218" height="96" rx="8" fill="#f8f9fa" stroke="#e0e0e0"/>
  <text x="398" y="322" class="t h" font-size="13">Formulaires &amp; automatisations</text>
  <text x="398" y="342" class="t" font-size="12">Trois cases, un résultat.</text>
  <text x="398" y="360" class="t" font-size="12">Veille chaque lundi 7 h,</text>
  <text x="398" y="378" class="t" font-size="12">e-mails pré-traités.</text>

  <!-- Bloc comptes-rendus -->
  <rect x="616" y="302" width="208" height="96" rx="8" fill="#f8f9fa" stroke="#e0e0e0"/>
  <text x="628" y="322" class="t h" font-size="13">Comptes-rendus</text>
  <text x="628" y="342" class="t" font-size="12">Un enregistrement (réunion,</text>
  <text x="628" y="360" class="t" font-size="12">RETEX, visite) devient un PV,</text>
  <text x="628" y="378" class="t" font-size="12">un relevé de décisions.</text>

  <!-- Bloc gouvernance -->
  <rect x="386" y="410" width="438" height="96" rx="8" fill="#f0fff0" stroke="#c0e0c0"/>
  <text x="398" y="430" class="t h" font-size="13">Le SDIS garde la main</text>
  <text x="398" y="450" class="t" font-size="12">• Règles d'accès : un chef de centre voit son centre, pas le voisin</text>
  <text x="398" y="468" class="t" font-size="12">• Journal d'activité : qui, quoi, quand — consultable par le DPD</text>
  <text x="398" y="486" class="t" font-size="12">• Budget par service, tableau de bord mensuel, empreinte carbone</text>

  <!-- Bloc données perso -->
  <rect x="386" y="518" width="438" height="96" rx="8" fill="#fff" stroke="#1a1a1a" stroke-dasharray="4 3"/>
  <text x="398" y="538" class="t h" font-size="13">Ce qui ne sort jamais du portail</text>
  <text x="398" y="558" class="t" font-size="12">Les documents complets · les noms des victimes et des agents</text>
  <text x="398" y="576" class="t" font-size="12">· les données personnelles (bloquées à la mémorisation)</text>
  <text x="398" y="596" class="t h r" font-size="12">Jamais utilisé pour entraîner un modèle d'IA — engagement écrit.</text>

  <!-- ===== Frontière ===== -->
  <line x1="880" y1="100" x2="880" y2="650" stroke="#E60000" stroke-width="3"/>
  <rect x="846" y="330" width="68" height="60" rx="6" fill="#E60000"/>
  <text x="880" y="352" class="t w h" font-size="11" text-anchor="middle">SEULS LES</text>
  <text x="880" y="366" class="t w h" font-size="11" text-anchor="middle">EXTRAITS</text>
  <text x="880" y="380" class="t w h" font-size="11" text-anchor="middle">UTILES</text>

  <!-- Flèches portail <-> modèles -->
  <line x1="840" y1="250" x2="936" y2="250" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fl)"/>
  <text x="918" y="240" class="t m" font-size="10.5" text-anchor="middle">extrait + consigne</text>
  <line x1="936" y1="470" x2="840" y2="470" stroke="#E60000" stroke-width="2" marker-end="url(#flr)"/>
  <text x="918" y="490" class="t m" font-size="10.5" text-anchor="middle">réponse</text>
  <text x="918" y="503" class="t m" font-size="10.5" text-anchor="middle">non conservée</text>

  <!-- ===== ZONE 3 : modèles ===== -->
  <text x="1058" y="136" class="t h" font-size="17" text-anchor="middle">3. Les modèles d'IA</text>
  <text x="1058" y="156" class="t m" font-size="12" text-anchor="middle">le « cerveau » — interchangeable</text>

  <rect x="940" y="176" width="236" height="60" rx="8" fill="#fff" stroke="#E60000" stroke-width="2"/>
  <text x="952" y="198" class="t h" font-size="13">Modèle européen</text>
  <text x="952" y="216" class="t m" font-size="11.5">par défaut · zéro rétention</text>
  <rect x="1100" y="184" width="66" height="18" rx="9" fill="#E60000"/>
  <text x="1133" y="197" class="t w h" font-size="10" text-anchor="middle">ACTIF</text>

  <rect x="940" y="248" width="236" height="60" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="952" y="270" class="t h" font-size="13">Modèle américain</text>
  <text x="952" y="288" class="t m" font-size="11.5">pour certaines tâches, si le SDIS l'autorise</text>

  <rect x="940" y="320" width="236" height="60" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="952" y="342" class="t h" font-size="13">Modèle libre (open source)</text>
  <text x="952" y="360" class="t m" font-size="11.5">coût minimal</text>

  <rect x="940" y="392" width="236" height="60" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="952" y="414" class="t h" font-size="13">Modèle hébergé au SDIS</text>
  <text x="952" y="432" class="t m" font-size="11.5">sur vos propres serveurs, option</text>

  <!-- Bascule -->
  <rect x="940" y="520" width="236" height="94" rx="8" fill="#f8f9fa" stroke="#e0e0e0"/>
  <text x="1058" y="542" class="t h" font-size="13" text-anchor="middle">Changez de modèle en 1 clic</text>
  <text x="1058" y="562" class="t m" font-size="11.5" text-anchor="middle">Assistants, documents, historique</text>
  <text x="1058" y="578" class="t m" font-size="11.5" text-anchor="middle">restent en place. Aucune dépendance</text>
  <text x="1058" y="594" class="t m" font-size="11.5" text-anchor="middle">à un fournisseur. Tout s'exporte.</text>

  <!-- Bandeau bas -->
  <rect x="24" y="676" width="1152" height="60" rx="10" fill="#1a1a1a"/>
  <text x="600" y="700" class="t w h" font-size="14" text-anchor="middle">Un portail IA, ce n'est pas un chatbot grand public : c'est un outil interne du SDIS, encadré, sourcé, tracé.</text>
  <text x="600" y="722" class="t w" font-size="12.5" text-anchor="middle">Aucune compétence informatique requise · déploiement technique en 48 h · SDIS 00, démonstrateur édité par Quarkley</text>
</svg>
